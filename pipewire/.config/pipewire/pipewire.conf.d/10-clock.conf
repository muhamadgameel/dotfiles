# Clock overrides. Drop-in fragment: only the keys below are changed, the rest
# of pipewire.conf keeps tracking the package. Never copy the whole packaged
# file here -- a stale copy shadows the package and rots across updates.

context.properties = {
    # Packaged default is 2048. A larger ceiling lets PipeWire hand out bigger
    # buffers to clients that ask for them, which is what stops xruns/crackle
    # under heavy CPU load (compiling, gaming). It is a ceiling, not a fixed
    # size -- latency-sensitive clients still negotiate small quanta, so this
    # costs nothing when nothing needs it.
    default.clock.max-quantum = 8192

    # Packaged default is [ 48000 ] alone, which forces every 44.1 kHz source
    # (most music, plenty of web audio) through the resampler. Listing 44100
    # lets the graph follow the source instead, when the device is otherwise
    # idle. Expect a brief gap at the moment the rate switches.
    #
    # It buys this laptop's own speakers nothing: the HDA analog output path
    # advertises 48000 alone (rates [0x40] in /proc/asound/card0/codec#0), and
    # PipeWire offers that one rate for the sink, so 44.1 kHz material is
    # resampled into a 48 kHz device however the graph is clocked - measured
    # against ALSA's hw_params, from a freshly suspended device. It is worth
    # keeping for anything that does support 44.1: Bluetooth over AAC, and
    # USB DACs.
    default.clock.allowed-rates = [ 48000 44100 ]
}
