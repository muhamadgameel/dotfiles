# Drop-in: only these keys change. The root README's Audio section explains them.

context.properties = {
    # A ceiling, not a fixed size: clients that ask for big buffers get them, so load doesn't crackle.
    default.clock.max-quantum = 8192

    # Follow 44.1 kHz sources instead of resampling. Helps Bluetooth AAC and USB DACs, not the speakers.
    default.clock.allowed-rates = [ 48000 44100 ]
}
