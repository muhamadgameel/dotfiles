# Bluetooth / route behaviour. Drop-in fragment -- see the note in
# pipewire.conf.d/10-clock.conf about never copying whole packaged configs.

wireplumber.settings = {
  # Both default to false. Without them, when your headphones go away while
  # audio is playing -- AirPods battery dies, you walk out of range, you yank
  # the jack -- playback instantly falls back to the laptop speakers at
  # whatever volume the headphones were using. These mute the fallback device
  # instead. Unmute manually when you actually want speakers.
  device.routes.mute-on-bluetooth-playback-removed = true
  device.routes.mute-on-alsa-playback-removed      = true

  # --- Deliberately left at defaults; documented here so the tradeoff is
  # --- visible rather than rediscovered later.
  #
  # bluetooth.autoswitch-to-headset-profile (default: true)
  #   True is why AirPods audio turns to mud the moment Chromium or Steam
  #   opens the mic: the headset drops from A2DP stereo to HFP mono. Setting
  #   it false keeps high-quality playback permanently, at the cost of having
  #   no Bluetooth microphone at all. Keep true if you take calls or use
  #   Steam voice; flip it if these are listening-only headphones.
  # bluetooth.autoswitch-to-headset-profile = false
  #
  # bluetooth.profile-preference (default: "quality")
  #   Already the right choice for AirPods -- prefers AAC over the low-latency
  #   fallbacks. Only worth "latency" if you game with Bluetooth audio and can
  #   tolerate worse quality for tighter sync.
}

# --- Also left off deliberately ---
# Bluetooth nodes suspend after 5s idle, which is what clips the first
# fraction of a second of a sound after silence and makes AirPods re-negotiate
# with an audible pop. Setting the timeout to 0 fixes that but holds the
# stream open permanently, which measurably drains headphone battery. Enable
# only if the clipping bothers you more than the battery does.
#
# monitor.bluez.rules = [
#   {
#     matches = [ { node.name = "~bluez_output.*" } ]
#     actions = { update-props = { session.suspend-timeout-seconds = 0 } }
#   }
# ]
