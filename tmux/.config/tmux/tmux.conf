# The prefix is the backtick; press it twice to type one.
set -g prefix '`'
unbind C-b
bind '`' send-prefix

# The terminal's own sixteen colours, so the status line follows the shell's theme.
set -s theme terminal
# Curly and coloured underlines, and links. tmux finds Alacritty's other abilities itself.
set -as terminal-features ",alacritty*:usstyle:hyperlinks"

set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# "dotfiles: nvim" as the terminal window's title.
set -g set-titles on
set -g set-titles-string "#S: #W"
