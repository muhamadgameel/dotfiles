; gamemode - merged over the built-in defaults (see `man gamemoded`)
;
; A game gets this by being launched through it. In Steam, set the game's launch
; options to:   gamemoderun %command%
; While it runs, `gamemoded -s` should say "gamemode is active".
;
; For 32-bit games, gamemode's 32-bit library has to be installed too:
; lib32-gamemode. Without it those titles silently get none of this.

[general]
; Leave the CPU governor where it is. With intel_pstate in active mode,
; `powersave` is still the dynamic governor. power-profiles-daemon owns the
; energy preference and the firmware platform profile - which is what actually
; raises this laptop's power limits and fan curve - and the shell switches it to
; Performance for the length of the game. Forcing the `performance` governor on
; top would pin the cores at high frequency: more heat, and on a laptop that
; means reaching thermal throttling sooner.
desiredgov=powersave
defaultgov=powersave

; Stop hypridle dimming and locking. A controller sends no keyboard or mouse
; input, so a long session otherwise looks idle.
inhibit_screensaver=1

[cpu]
; Keep game threads on the performance cores of this i9-13900HX. gamemode
; recognises Intel P/E-core parts by itself; this is its default, written out so
; it is not a surprise.
pin_cores=yes

[custom]
; Tell the shell a game started or stopped. It holds notification popups back
; and raises the power profile (quickshell/services/GameMode.qml). Harmless if
; the shell is not running - the call just fails.
start=qs ipc call gamemode enter
end=qs ipc call gamemode exit
script_timeout=5
