; Merged over gamemode's defaults (man gamemoded). Games opt in through gamemoderun; see the root README.

[general]
; Leave the governor alone: the platform profile, which the shell raises, sets the power limits and fans.
desiredgov=powersave
defaultgov=powersave

; The game outranks everything else running: nice -10, the most the gamemode group may ask for.
renice=10

[custom]
; Tell the shell (services/GameMode.qml); harmless when it isn't running.
start=qs ipc call gamemode enter
end=qs ipc call gamemode exit
script_timeout=5
