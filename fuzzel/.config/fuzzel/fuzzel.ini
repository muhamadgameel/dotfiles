# Fuzzel configuration - TokyoNight Night theme
# Options that only restate the upstream default are omitted; see
# /etc/xdg/fuzzel/fuzzel.ini or fuzzel.ini(5) for the full list.

[main]
font=JetBrainsMono Nerd Font:size=12
use-bold=yes

# ── Sizing & layout ──────────────────────────────────────────────────
width=60
lines=16
horizontal-pad=16
vertical-pad=12
inner-pad=12
tabs=4
letter-spacing=0.5

# dmenu mode only: shrink to the actual entry count instead of always
# reserving `lines` rows (keeps the Super+V cliphist popup compact).
minimal-lines=yes

# Don't blow up the icon into a preview when only a match or two is left.
image-size-ratio=1

# ── Search & matching ────────────────────────────────────────────────
placeholder=Search applications…
match-counter=yes

# Match against keywords/comment too, so "browser" or "editor" find apps
# that don't carry the word in their name.
fields=filename,name,generic,keywords,comment

# Hide entries not meant for this desktop (XDG_CURRENT_DESKTOP=Hyprland).
filter-desktop=yes

# ── Launching ────────────────────────────────────────────────────────
icon-theme=Papirus-Dark

# {cmd} placeholder (fuzzel >= 1.14) - also titles the window after the program.
terminal=alacritty -T {cmd} -e {cmd}

# Each app gets its own systemd scope instead of living in the compositor's or the shell's unit.
launch-prefix=uwsm app --

# ── Performance ──────────────────────────────────────────────────────
# 32 logical CPUs here, but fuzzel can't parallelize past the displayed
# rows - capping avoids spawning 32 threads on every launch.
render-workers=8
match-workers=8

[colors]
# Background - TokyoNight bg (#1a1b26) with ~80% opacity for blur
background=1a1b26cc

# Text - TokyoNight foreground
text=c0caf5ff
input=c0caf5ff
prompt=7aa2f7ff
placeholder=565f89ff
counter=565f89ff
message=9aa5ceff

# Selection - TokyoNight visual selection bg, accent for text
selection=283457ff
selection-text=7aa2f7ff
selection-match=bb9af7ff

# Match highlight - TokyoNight magenta
match=bb9af7ff

# Border - TokyoNight comment/inactive
border=565f89ff

[border]
width=2
radius=12
selection-radius=8

[dmenu]
# Tuning for the cliphist pipe bound to Super+V.
exit-immediately-if-empty=yes

[key-bindings]
# Tab cycles through matches instead of executing the sole match.
# Freeing Tab requires unbinding its default action first.
execute-or-next=none
next-with-wrap=Tab
prev-with-wrap=ISO_Left_Tab

# Worth knowing, already bound by default (left implicit):
#   Control+Tab              insert selected entry into the prompt
#   Control+Shift+BackSpace  clear the whole input
#   Shift+Delete             drop entry from the launch-count cache
#   Shift+Return             execute the raw input as typed
