[General]
IndentWidth=2
UseTabs=false
NewlineType=native
NormalizeOrder=false
FunctionsSpacing=true
ObjectsSpacing=true
SortImports=true
SemicolonRule=always
; -1 disables line wrapping. qmlformat breaks long ternaries and
; multi-argument calls at odd points and indents the continuations under the
; opening paren, which reads worse than the long line it replaced.
MaxColumnWidth=-1
