# ╔═══════════════════════════════════════════════════════════════════╗
# ║                        HYPRPAPER CONFIG                            ║
# ╚═══════════════════════════════════════════════════════════════════╝
#
# Keep wallpapers at 3840x2160 or below. hyprpaper renders through
# hyprtoolkit, which uploads each image as a texture at its *native* pixel
# size - fit_mode is applied as texture coordinates when drawing, so it never
# shrinks what is resident. The screen's resolution does not come into it.
#
# 0.8.4 offers no lever for this: there is no cache setting, and preload /
# unload / listloaded were removed when the IPC moved to hyprwire. The file
# dimensions are the only control. See hyprwm/hyprpaper#345.

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers
    fit_mode = cover
    timeout = 3600
}
