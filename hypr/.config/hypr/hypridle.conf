general {
    # Never two locks at once. Before the first: drop the shell's open panel, with no
    # slide for the lock to freeze part-way, and go back to English. timeout: a stuck
    # shell must not hold up the lock.
    lock_cmd = pidof hyprlock || (timeout 1 qs ipc call panel closeNow; hyprctl switchxkblayout all 0; hyprlock)
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # Turn on screen after resume
}

# ── Dim Screen (5 minutes) ───────────────────────────────────────────
listener {
    timeout = 300                               # 5 minutes
    on-timeout = brightnessctl -s set 10%       # Dim screen to 10%
    on-resume = brightnessctl -r                # Restore previous brightness
}

# ── Lock Screen (10 minutes) ─────────────────────────────────────────
listener {
    timeout = 600                               # 10 minutes
    on-timeout = loginctl lock-session          # Lock session
}

# ── Turn Off Screen (1 minute idle while locked) ─────────────────────
listener {
    timeout = 60                                # 1 minute
    condition_cmd = pidof hyprlock              # Only while locked
    condition_retry = 60                        # Check again each minute, so the idle lock is caught too
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'  # Turn off display
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # Turn on display
    ignore_inhibit = true                       # Audio and Stay Awake don't keep a locked screen lit
}
