$font = JetBrainsMono Nerd Font

# Tokyo Night until the shell writes the active theme to the file sourced below.
$accent = rgb(7aa2f7)
$accentAlpha = rgba(7aa2f7ee)
$surface = rgba(1a1b26e6)
$text = rgb(c0caf5)
$subtext = rgb(a9b1d6)
$error = rgb(f7768e)
$success = rgb(9ece6a)
$warning = rgba(e0af68e6)

source = ~/.local/state/quickshell/hyprlock-colors.conf

# ── General ──────────────────────────────────────────────────────────
general {
    hide_cursor = true
    ignore_empty_input = true
}

# ── Animations ───────────────────────────────────────────────────────
animations {
    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, linear
}

# ── Background ───────────────────────────────────────────────────────
background {
    path = screenshot
    blur_passes = 4
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# ── Input Field ──────────────────────────────────────────────────────
input-field {
    size = 350, 55
    outline_thickness = 2
    rounding = 15

    inner_color = $surface
    outer_color = $accent
    font_color = $text

    check_color = $success
    fail_color = $error
    capslock_color = $warning

    fade_on_empty = false

    font_family = $font
    placeholder_text = <i>  Enter Password...</i>
    fail_text = <i>$PAMFAIL</i>

    dots_size = 0.3

    position = 0, -120
}

# ── Clock ────────────────────────────────────────────────────────────
label {
    text = $TIME
    font_size = 120
    font_family = $font

    color = $text
    shadow_passes = 2

    position = 0, 200
}

# ── Date ─────────────────────────────────────────────────────────────
label {
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 24
    font_family = $font

    color = $subtext

    position = 0, 100
}

# ── User Greeting ────────────────────────────────────────────────────
label {
    text = Hi, $USER
    font_size = 18
    font_family = $font

    color = $subtext

    position = 0, -50
}

# ── Keyboard Layout ──────────────────────────────────────────────────
label {
    text = $LAYOUT[EN,AR]
    font_size = 14
    font_family = $font

    color = $subtext
    onclick = hyprctl switchxkblayout all next

    position = 0, -200
}
