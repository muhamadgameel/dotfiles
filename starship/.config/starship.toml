"$schema" = 'https://starship.rs/config-schema.json'

# The blank line above each prompt lives in `format` below rather than in
# `add_newline`, because add_newline also prepends a newline to the claude-code
# statusline, where it costs a whole row.
add_newline = false

# Colours are named, not given as values: they are the terminal's own 16, so
# the prompt follows whatever theme the terminal has.

format = """

$username\
$hostname\
$localip\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$package\
$nodejs\
$deno\
$bun\
$python\
$rust\
$golang\
$java\
$lua\
$c\
$cpp\
$zig\
$php\
$ruby\
$container\
$cmd_duration\
$jobs\
$status\
$character"""

# username, hostname and localip are all SSH-gated, so they render as a group or
# not at all -- which is why hostname carries no trailing space of its own.
[username]
format = '[$user]($style) '
style_user = 'bold blue'
style_root = 'bold red'

[hostname]
format = '[$ssh_symbol$hostname]($style)'
ssh_symbol = ' '
style = 'bold purple'

[localip]
format = '[@$localipv4](bold red) '
disabled = false

[directory]
format = '[ ](bold blue)[$path]($style)[$read_only]($read_only_style) '
# Used instead of `format` inside a repo: dims the path above the repo root so
# the project name is what the eye lands on.
repo_root_format = '[ ](bold blue)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '
style = 'blue'
repo_root_style = 'bold blue'
before_repo_root_style = 'bright-black'
read_only = ' '
truncation_symbol = '…/'

[git_branch]
format = '[ $branch(:$remote_branch)]($style) '
style = 'purple'

[git_commit]
style = 'bright-black'
tag_symbol = '  '

[git_state]
style = 'yellow'

[git_metrics]
disabled = false
added_style = 'green'
deleted_style = 'red'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'yellow'
# Submodule scanning is the expensive half of this module and near-useless here.
ignore_submodules = true
conflicted = ' '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = ' '
stashed = ' '
modified = ' '
staged = ' '
renamed = ' '
deleted = ' '
typechanged = ' '

[package]
format = '[ $version]($style) '
style = 'yellow'

[nodejs]
format = '[ $version]($style) '
style = 'green'

[deno]
format = '[ $version]($style) '
style = 'green'

[bun]
format = '[ $version]($style) '
style = 'yellow'

[python]
format = '[ $version(\($virtualenv\))]($style) '
style = 'yellow'

[rust]
format = '[ $version]($style) '
style = 'red'

[golang]
format = '[ $version]($style) '
style = 'cyan'

[java]
format = '[ $version]($style) '
style = 'red'

[lua]
format = '[ $version]($style) '
style = 'blue'

[c]
format = '[ $version(-$name)]($style) '
style = 'blue'

[cpp]
format = '[ $version(-$name)]($style) '
style = 'blue'
disabled = false

[zig]
format = '[ $version]($style) '
style = 'bright-yellow'

[php]
format = '[ $version]($style) '
style = 'purple'

[ruby]
format = '[ $version]($style) '
style = 'red'

[container]
format = '[󰡨 $name]($style) '
style = 'bright-yellow'

[cmd_duration]
format = '[ $duration]($style) '
style = 'yellow'
min_time = 1_000

[jobs]
symbol = ' '
style = 'cyan'
number_threshold = 1

[status]
disabled = false
# $common_meaning / $signal_name turn 139 into SEGV and 130 into INT.
format = '[$symbol $common_meaning$signal_name$maybe_int]($style) '
symbol = ''
not_executable_symbol = ''
not_found_symbol = ''
sigint_symbol = ''
signal_symbol = ''
style = 'red'
map_symbol = true
# Shows which stage of a pipeline actually failed, not just the last one.
pipestatus = true
pipestatus_separator = '[|](bright-black)'
pipestatus_segment_format = '[$status](bright-black)'
pipestatus_format = '\[$pipestatus\] => [$symbol $common_meaning$signal_name$maybe_int]($style) '

# --- Claude Code statusline (starship >= 1.26) -----------------------------
# Rendered by `starship statusline claude-code`; wired up in ~/.claude/settings.json.

[profiles]
claude-code = '$claude_model$directory$git_branch$git_status$claude_context$claude_cost'

[claude_model]
symbol = '󱜙 '
style = 'bold purple'

[claude_context]
gauge_width = 8

[[claude_context.display]]
threshold = 0.0
style = 'green'
hidden = false

[[claude_context.display]]
threshold = 60.0
style = 'yellow'
hidden = false

[[claude_context.display]]
threshold = 80.0
style = 'bold red'
hidden = false

[claude_cost]
symbol = ' '

[[claude_cost.display]]
threshold = 0.0
style = 'green'
hidden = true

[[claude_cost.display]]
threshold = 1.0
style = 'yellow'
hidden = false

[[claude_cost.display]]
threshold = 5.0
style = 'bold red'
hidden = false
